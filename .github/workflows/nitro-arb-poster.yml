##############################################################################
# nitro-arb-poster.yml
#
# Builds a self-contained AWS Nitro EIF runner image from a published
# nitro-espresso-integration image and pushes a single tag to the registry:
#
#   aws-nitro-arb-poster:<chain>-<tag>  — self-contained runner (what Terraform/ECS deploys).
#
# Config source of truth: chains/nitro/<chain>.json
#   Config hash is auto-computed with jq — identical to aws-nitro-entrypoint.sh.
#   Excluded fields (not part of the hash): private-key, parent-chain URL,
#   txns intervals, data-availability, and celestia-cfg.
#
#   Private values (DA aggregator URLs, celestia URL) are injected at runtime
#   from AWS Secrets Manager and are trusted via IAM — not hashed.
#
##############################################################################

name: Build EIF Image (Arb)

run-name: Build EIF Image (Arb) - ${{ inputs.chain || 'rari-testnet' }} @ ${{ inputs.nitro_node_image_path || 'integration' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      chain:
        description: >
          Arbitrum chain to build, e.g. rari-testnet.
          Selects chains/nitro/<chain>.json for config and hash computation.
        required: true
      nitro_node_image_path:
        type: string
        description: 'Full nitro node image path (e.g. ghcr.io/espressosystems/nitro-espresso-integration/nitro-node:v1.2.3)'
        required: true
      aws_region:
        type: string
        description: 'AWS region for Secrets Manager'
        required: true
      aws_secret_id:
        type: string
        description: 'AWS Secrets Manager secret ARN'
        required: true

env:
  REGISTRY: ghcr.io
  EIF_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aws-nitro-arb-poster
  CHAIN: ${{ github.event.inputs.chain || 'rari-testnet' }}

jobs:
  build-eif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          echo "EIF_IMAGE_NAME=${EIF_IMAGE_NAME,,}" >> $GITHUB_ENV

          NITRO_IMAGE_PATH="${{ github.event.inputs.nitro_node_image_path || 'ghcr.io/espressosystems/nitro-espresso-integration/nitro-node:integration' }}"
          NITRO_TAG=$(echo "${NITRO_IMAGE_PATH}" | sed 's/.*://')
          echo "NITRO_IMAGE_PATH=${NITRO_IMAGE_PATH}" >> $GITHUB_ENV
          echo "NITRO_IMAGE_TAG=${NITRO_TAG}" >> $GITHUB_ENV

          CONFIG_PATH="chains/nitro/${{ env.CHAIN }}.json"
          echo "CONFIG_PATH=${CONFIG_PATH}" >> $GITHUB_ENV

          echo "Using nitro image: ${NITRO_IMAGE_PATH}"
          echo "Using config: ${CONFIG_PATH}"

      - name: Compute config hash
        run: |
          # Computed with jq — identical to the del() in aws-nitro-entrypoint.sh.
          # Private fields (DA aggregator URLs, celestia URL) are excluded from the hash
          # and injected at runtime from AWS Secrets Manager.
          CONFIG_HASH=$(jq -cS 'del(
            .node."batch-poster"."parent-chain-wallet"."private-key",
            .node.espresso."batch-poster"."txns-monitoring-interval",
            .node.espresso."batch-poster"."txns-resubmission-interval",
            .node.espresso.streamer."txns-polling-interval",
            ."parent-chain".connection.url,
            .node."data-availability",
            .node."celestia-cfg"
          )' "${{ env.CONFIG_PATH }}" | sha256sum | cut -d' ' -f1)
          echo "CONFIG_HASH=${CONFIG_HASH}" >> $GITHUB_ENV
          echo "Config hash: ${CONFIG_HASH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: ./aws-nitro
          file: ./aws-nitro/nitro/docker/Dockerfile.aws-nitro-poster
          build-args: |
            NITRO_IMAGE_PATH=${{ env.NITRO_IMAGE_PATH }}
            CONFIG_HASH=${{ env.CONFIG_HASH }}
            AWS_REGION=${{ github.event.inputs.aws_region }}
            AWS_SECRET_ID=${{ github.event.inputs.aws_secret_id }}
          push: false
          tags: nitro-image:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install enclaver
        run: |
          # Verify SHA256 before extracting — a malicious binary could produce a
          # fraudulent EIF with a fake PCR0.
          ENCLAVER_URL="https://github.com/enclaver-io/enclaver/releases/download/v0.5.0/enclaver-linux-x86_64-v0.5.0.tar.gz"
          ENCLAVER_SHA256="c1a09f9dc4c687bf321bbfa0cf42451a3b1618457e21c39498884cd3bce0b3e3"
          ENCLAVER_TARBALL="/tmp/enclaver.tar.gz"
          curl -fsSL "${ENCLAVER_URL}" -o "${ENCLAVER_TARBALL}"
          echo "${ENCLAVER_SHA256}  ${ENCLAVER_TARBALL}" | sha256sum -c
          tar xz --strip-components=1 -C /usr/local/bin enclaver-linux-x86_64-v0.5.0/enclaver < "${ENCLAVER_TARBALL}"
          rm -f "${ENCLAVER_TARBALL}"
          enclaver --version

      - name: Build EIF and capture measurements
        run: |
          EIF_TAG="${{ env.EIF_IMAGE_NAME }}:${{ env.CHAIN }}-${{ env.NITRO_IMAGE_TAG }}"
          echo "EIF_TAG=${EIF_TAG}" >> $GITHUB_ENV

          # enclaver build wraps nitro-image:latest (from the previous step) into an EIF
          # and produces a local image tagged as per enclaver.yaml target field.
          BUILD_OUTPUT=$(sudo enclaver build --file ./aws-nitro/nitro/enclaver/enclaver.yaml)
          echo "Build output: ${BUILD_OUTPUT}"

          PCR0=$(echo "${BUILD_OUTPUT}" | grep -oP '"PCR0": "\K[^"]+')
          PCR1=$(echo "${BUILD_OUTPUT}" | grep -oP '"PCR1": "\K[^"]+')
          PCR2=$(echo "${BUILD_OUTPUT}" | grep -oP '"PCR2": "\K[^"]+')

          if [ -z "${PCR0}" ]; then
            echo "ERROR: empty PCR0 — enclaver build failed"
            exit 1
          fi

          ENCLAVE_HASH=$(cast keccak "0x${PCR0}")
          echo "PCR0=${PCR0}" >> $GITHUB_ENV
          echo "PCR1=${PCR1}" >> $GITHUB_ENV
          echo "PCR2=${PCR2}" >> $GITHUB_ENV
          echo "ENCLAVE_HASH=${ENCLAVE_HASH}" >> $GITHUB_ENV
          echo "PCR0 keccak hash: ${ENCLAVE_HASH}"

      - name: Publish release assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ env.CHAIN }}-${{ env.NITRO_IMAGE_TAG }}"
          BASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          echo "CONFIG_ASSET_URL=${BASE_URL}/committed-config.json" >> $GITHUB_ENV

          # Generate machine-readable measurements file
          jq -n \
            --arg chain "${{ env.CHAIN }}" \
            --arg nitro_image "${{ env.NITRO_IMAGE_PATH }}" \
            --arg runner_image "${{ env.EIF_TAG }}" \
            --arg pcr0 "${{ env.PCR0 }}" \
            --arg pcr1 "${{ env.PCR1 }}" \
            --arg pcr2 "${{ env.PCR2 }}" \
            --arg enclave_hash "${{ env.ENCLAVE_HASH }}" \
            --arg config_hash "${{ env.CONFIG_HASH }}" \
            --arg build_workflow "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg git_sha "${{ github.sha }}" \
            '{
              chain: $chain,
              "nitro-image": $nitro_image,
              "runner-image": $runner_image,
              pcr0: $pcr0,
              pcr1: $pcr1,
              pcr2: $pcr2,
              "enclave-hash": $enclave_hash,
              "config-hash": $config_hash,
              "build-workflow": $build_workflow,
              "git-sha": $git_sha
            }' > /tmp/measurements.json

          {
            echo "## Chain: \`${{ env.CHAIN }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **TEE type** | AWS Nitro (Arbitrum) |"
            echo "| **Nitro image** | \`${{ env.NITRO_IMAGE_PATH }}\` |"
            echo "| **Runner image** | \`${{ env.EIF_TAG }}\` |"
            echo "| **PCR0** | \`${{ env.PCR0 }}\` |"
            echo "| **PCR1** | \`${{ env.PCR1 }}\` |"
            echo "| **PCR2** | \`${{ env.PCR2 }}\` |"
            echo "| **Enclave hash (keccak)** | \`${{ env.ENCLAVE_HASH }}\` |"
            echo "| **Config hash** | \`${{ env.CONFIG_HASH }}\` |"
            echo "| **Build workflow** | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "### Assets"
            echo "- \`committed-config.json\` — full public config with placeholders for private values"
            echo "- \`measurements.json\` — machine-readable PCR values and hashes for programmatic verification"
          } > /tmp/release-notes.md

          gh release create "${RELEASE_TAG}" \
            --title "[Nitro/Arb] ${{ env.CHAIN }} @ ${{ env.NITRO_IMAGE_TAG }}" \
            --notes-file /tmp/release-notes.md \
            2>/dev/null || true

          gh release edit "${RELEASE_TAG}" \
            --title "[Nitro/Arb] ${{ env.CHAIN }} @ ${{ env.NITRO_IMAGE_TAG }}" \
            --notes-file /tmp/release-notes.md

          gh release upload "${RELEASE_TAG}" \
            "${{ env.CONFIG_PATH }}#committed-config.json" \
            /tmp/measurements.json \
            --clobber

          echo "Release published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

      - name: Add OCI labels and push
        if: github.event_name == 'workflow_dispatch'
        run: |
          BUILDCTX=$(mktemp -d)
          python3 scripts/nitro-config.py "${{ env.CONFIG_PATH }}" labels > /tmp/config-labels.txt

          # enclaver-batch-poster is the local image produced by the previous step
          # (target name defined in aws-nitro/nitro/enclaver/enclaver.yaml).
          {
            echo "FROM enclaver-batch-poster"
            echo 'LABEL enclave.pcr0="${{ env.PCR0 }}"'
            echo 'LABEL enclave.pcr1="${{ env.PCR1 }}"'
            echo 'LABEL enclave.pcr2="${{ env.PCR2 }}"'
            echo 'LABEL enclave.hash="${{ env.ENCLAVE_HASH }}"'
            echo 'LABEL enclave.chain="${{ env.CHAIN }}"'
            echo 'LABEL enclave.nitro-image="${{ env.NITRO_IMAGE_PATH }}"'
            echo 'LABEL enclave.config-hash="${{ env.CONFIG_HASH }}"'
            echo 'LABEL enclave.config-url="${{ env.CONFIG_ASSET_URL }}"'
            cat /tmp/config-labels.txt
            echo 'LABEL org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}"'
            echo 'LABEL org.opencontainers.image.revision="${{ github.sha }}"'
            echo 'LABEL build.workflow.url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'
          } > "$BUILDCTX/Dockerfile"

          docker build -t "${{ env.EIF_TAG }}" "$BUILDCTX"
          rm -rf "$BUILDCTX" /tmp/config-labels.txt

          docker push "${{ env.EIF_TAG }}"

      - name: Summary
        run: |
          echo "## EIF Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Chain** | \`${{ env.CHAIN }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Nitro image** | \`${{ env.NITRO_IMAGE_PATH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner image** | \`${{ env.EIF_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PCR0** | \`${{ env.PCR0 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PCR1** | \`${{ env.PCR1 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PCR2** | \`${{ env.PCR2 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Enclave hash (keccak)** | \`${{ env.ENCLAVE_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Config hash** | \`${{ env.CONFIG_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Config hash auto-computed from \`${{ env.CONFIG_PATH }}\`." >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.CONFIG_ASSET_URL }}" ]; then
            echo "| **Config URL** | ${{ env.CONFIG_ASSET_URL }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Run \`docker inspect ${{ env.EIF_TAG }}\` to view all labels." >> $GITHUB_STEP_SUMMARY
